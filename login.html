<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Solar</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <a class="auth-brand" href="index.html"><img src="favicon.ico" alt="" />Solar<span>PREVENCIÓN TÉRMICA</span></a>
      <section class="auth-card">
        <div class="auth-copy">
          <p class="eyebrow">SOLAR APP</p>
          <h1>Tu bienestar,<br /><span>en una sola vista.</span></h1>
          <p>Consulta tu estado térmico y recibe recomendaciones claras para moverte con más seguridad.</p>
          <a class="auth-back" href="index.html">← Volver a Solar</a>
        </div>
        <form class="auth-form" id="loginForm">
          <h2>Iniciar sesión</h2>
          <p class="auth-muted">Accede a tu panel preventivo.</p>
          <label>Correo electrónico<input type="email" name="email" required placeholder="tu@correo.com" /></label>
          <label>Contraseña<input type="password" name="password" required placeholder="••••••••" /></label>
          <button class="auth-submit" type="submit">Entrar al dashboard <span>→</span></button>
          <p class="auth-switch">¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a></p>
          <p class="auth-feedback" id="authFeedback"></p>
        </form>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
